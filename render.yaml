# Render.com 免费部署配置（无需信用卡）
# 使用说明：
#   1. 注册 https://render.com（用 GitHub 账号登录，免费）
#   2. New → Web Service → 选择你的 GitHub 仓库
#   3. Render 会自动读取此文件并配置服务
#   4. 在 Environment 页面填写需要保密的环境变量

services:
  - type: web
    name: campus-simulator-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://yuchenfu701.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
